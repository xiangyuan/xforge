[workspace]
members = [
    "crates/xforge-core",
    "crates/xforge-model",
    "crates/xforge-objects",
    "crates/xforge-builder",
    "crates/xforge-query",
    "crates/xforge-serialization",
    "crates/xforge-cli",
    "crates/xforge-workspace",
    "crates/xforge-scheme",
    "crates/xforge-config",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["XForge Contributors"]
license = "MIT OR Apache-2.0"
keywords = ["xcode", "pbx", "ios", "macos", "project"]
categories = ["development-tools", "parser-implementations"]

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.6"
quick-xml = { version = "0.36", features = ["serialize"] }

# UUID and utilities
uuid = { version = "1.6", features = ["v4"] }
once_cell = "1.19"

# Collections
indexmap = { version = "2.1", features = ["serde"] }

# File operations
walkdir = "2.4"
tempfile = "3.8"

# Text processing
regex = "1.10"

# CLI (optional)
clap = { version = "4.4", features = ["derive"] }

# Internal workspace crates
xforge-core = { path = "crates/xforge-core" }
xforge-model = { path = "crates/xforge-model" }
xforge-objects = { path = "crates/xforge-objects" }
xforge-builder = { path = "crates/xforge-builder" }
xforge-query = { path = "crates/xforge-query" }
xforge-serialization = { path = "crates/xforge-serialization" }
xforge-workspace = { path = "crates/xforge-workspace" }
xforge-scheme = { path = "crates/xforge-scheme" }
xforge-config = { path = "crates/xforge-config" }

[package]
name = "xforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A modern, type-safe Rust library for creating and manipulating Xcode project files"

[dependencies]
xforge-core.workspace = true
xforge-model.workspace = true
xforge-objects.workspace = true
xforge-builder.workspace = true
xforge-query.workspace = true
xforge-serialization.workspace = true
xforge-workspace.workspace = true
xforge-scheme.workspace = true
xforge-config.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
